<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Assistant Demo</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --line: #e3e6ea;
        --text: #1b1f24;
        --muted: #6b7280;
        --accent: #2563eb;
        --user: #eef2ff;
        --assistant: #f3f4f6;
        --warn: #fef3c7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      header {
        padding: 14px 20px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      header h1 { margin: 0; font-size: 16px; font-weight: 600; }
      header .status { color: var(--muted); font-size: 13px; }
      header .status b { color: var(--text); font-weight: 600; }
      main {
        flex: 1;
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        padding: 16px 20px 0;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #connection { margin-bottom: 12px; }
      #connection summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 13px;
        padding: 4px 0;
      }
      .fields { display: grid; gap: 8px; margin-top: 8px; }
      .fields label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
      .fields input {
        font: inherit;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
      }
      .fields .row { display: flex; gap: 8px; align-items: center; }
      .fields button { font: inherit; }
      #log {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 8px 0 16px;
        min-height: 240px;
      }
      .msg {
        max-width: 85%;
        padding: 10px 12px;
        border-radius: 12px;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .msg.user { align-self: flex-end; background: var(--user); }
      .msg.assistant { align-self: flex-start; background: var(--assistant); }
      .msg.notice { align-self: stretch; background: var(--warn); font-size: 13px; }
      .msg .role { display: block; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
      form {
        display: flex;
        gap: 8px;
        padding: 12px 0 18px;
        border-top: 1px solid var(--line);
        background: var(--bg);
      }
      #text {
        flex: 1;
        font: inherit;
        resize: none;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        max-height: 160px;
      }
      button {
        font: inherit;
        padding: 10px 16px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button:disabled { opacity: .5; cursor: default; }
      button.ghost { background: transparent; color: var(--text); border-color: var(--line); }
    </style>
  </head>
  <body>
    <header>
      <h1>AI Assistant Demo</h1>
      <span class="status">Connection: <b id="status">not configured</b></span>
    </header>

    <main>
      <details id="connection">
        <summary>Connection settings</summary>
        <div class="fields">
          <label>
            API base URL
            <input id="endpoint" type="url" placeholder="https://ai-automation.example.com" autocomplete="off" />
          </label>
          <label>
            API key / token
            <input id="key" type="password" placeholder="Paste the key the platform issues" autocomplete="off" />
          </label>
          <div class="row">
            <button type="button" id="save">Save</button>
            <button type="button" class="ghost" id="clear">Clear</button>
            <span class="status" id="saved"></span>
          </div>
        </div>
      </details>

      <div id="log" role="log" aria-live="polite"></div>

      <form id="composer">
        <textarea id="text" rows="1" placeholder="Ask the assistant…" aria-label="Message"></textarea>
        <button type="submit" id="send">Send</button>
      </form>
    </main>

    <script>
      // One page, one conversation, no framework: this exists to measure how much effort it
      // takes to plug a third-party page into the platform. Everything that is not the
      // integration is deliberately absent.
      const els = {
        log: document.getElementById('log'),
        form: document.getElementById('composer'),
        text: document.getElementById('text'),
        send: document.getElementById('send'),
        endpoint: document.getElementById('endpoint'),
        key: document.getElementById('key'),
        status: document.getElementById('status'),
        saved: document.getElementById('saved'),
      };

      const store = {
        endpoint: 'demo.endpoint',
        key: 'demo.key',
      };

      function config() {
        return {
          endpoint: (els.endpoint.value || '').trim().replace(/\/+$/, ''),
          key: (els.key.value || '').trim(),
        };
      }

      function renderStatus() {
        const { endpoint } = config();
        els.status.textContent = endpoint ? endpoint : 'not configured';
        els.status.title = endpoint || '';
      }

      function restore() {
        els.endpoint.value = localStorage.getItem(store.endpoint) || '';
        els.key.value = localStorage.getItem(store.key) || '';
        renderStatus();
      }

      function save() {
        const { endpoint, key } = config();
        localStorage.setItem(store.endpoint, endpoint);
        localStorage.setItem(store.key, key);
        renderStatus();
        els.saved.textContent = 'saved';
        setTimeout(() => (els.saved.textContent = ''), 1500);
      }

      function clear() {
        els.endpoint.value = '';
        els.key.value = '';
        localStorage.removeItem(store.endpoint);
        localStorage.removeItem(store.key);
        renderStatus();
        els.saved.textContent = 'cleared';
        setTimeout(() => (els.saved.textContent = ''), 1500);
      }

      function add(role, text) {
        const el = document.createElement('div');
        el.className = 'msg ' + role;
        const label = document.createElement('span');
        label.className = 'role';
        label.textContent = role === 'notice' ? 'notice' : role;
        el.append(label, document.createTextNode(text));
        els.log.append(el);
        els.log.scrollTop = els.log.scrollHeight;
        return el;
      }

      // ---- the integration surface: the only part that changes when we wire it up ----------
      // Everything above is the demo page. Everything below is what a customer's developer
      // would write, and what we are measuring the effort of.

      /**
       * Sends one message and returns the assistant's reply.
       * TODO(integration): replace the body with the platform's chat call, once the
       * contract is fixed (auth, streaming, files). Two questions it has to answer:
       *   - how the caller proves who it is (API key? OAuth? session?),
       *   - whether the reply arrives whole or token by token.
       */
      async function ask(text) {
        const { endpoint } = config();
        if (!endpoint) {
          throw new Error('No API base URL set. Open Connection settings and paste it.');
        }
        throw new Error(
          'Integration not wired yet: the platform has not published the chat contract.',
        );
        // Shape it will likely take (kept here so the effort is visible):
        // const res = await fetch(endpoint + '/api/chat/messages', {
        //   method: 'POST',
        //   credentials: 'include',                       // cookie session, or an auth header
        //   headers: { 'content-type': 'application/json', /* authorization?: ... */ },
        //   body: JSON.stringify({ text }),
        // });
        // if (!res.ok) throw new Error('Chat failed: HTTP ' + res.status);
        // return readReply(...);                          // whole reply, or the stream
      }

      // ---- page wiring ---------------------------------------------------------------------

      els.text.addEventListener('input', () => {
        els.text.style.height = 'auto';
        els.text.style.height = Math.min(els.text.scrollHeight, 160) + 'px';
      });

      els.text.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          els.form.requestSubmit();
        }
      });

      els.form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const text = els.text.value.trim();
        if (!text) return;
        els.text.value = '';
        els.text.style.height = 'auto';
        add('user', text);
        els.send.disabled = true;
        try {
          const reply = await ask(text);
          add('assistant', reply);
        } catch (error) {
          add('notice', error.message);
        } finally {
          els.send.disabled = false;
          els.text.focus();
        }
      });

      document.getElementById('save').addEventListener('click', save);
      document.getElementById('clear').addEventListener('click', clear);

      restore();
      add('assistant', 'Hello. This page is a demo shell: one page, one conversation. The connection to the platform is not wired yet.');
    </script>
  </body>
</html>
